name: Build Base Images
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [deps-updated]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE_NAME: ghcr.io/north-relay/northrelay-base
jobs:
  scan:
    name: Build and verify (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: builder-latest
            dockerfile: Dockerfile.builder
            category: .github/workflows/build-base.yml:scan/image:builder-latest
          - image: runner-latest
            dockerfile: Dockerfile.runner
            category: .github/workflows/build-base.yml:scan/image:runner-latest
          - image: builder-alpine-latest
            dockerfile: Dockerfile.builder.alpine
            category: .github/workflows/build-alpine.yml:scan/image:builder-alpine-latest
          - image: runner-alpine-latest
            dockerfile: Dockerfile.runner.alpine
            category: .github/workflows/build-alpine.yml:scan/image:runner-alpine-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build locally before publication
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: northrelay-base:${{ matrix.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify installed tooling and application dependencies
        env:
          IMAGE: northrelay-base:${{ matrix.image }}
        run: bash tests/image-smoke.sh "$IMAGE"
      - name: Free exported build cache before scanning
        run: docker buildx prune --all --force
      - name: Scan all image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: northrelay-base:${{ matrix.image }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-image.json
      - name: Convert complete report to SARIF
        run: trivy convert --format sarif --output trivy-image.sarif trivy-image.json
      - name: Update security alerts in the original image category
        if: always() && github.ref == 'refs/heads/main' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@38b3b7bf288d49ccf58644769dc7a6afdccd05eb # v3
        with:
          sarif_file: trivy-image.sarif
          category: ${{ matrix.category }}
      - name: Retain complete scan evidence
        if: always() && hashFiles('trivy-image.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-${{ matrix.image }}
          path: trivy-image.*
          retention-days: 30
      - name: Reject every vulnerability with an available fix
        run: node scripts/check-image-scan.mjs trivy-image.json
      - name: Save the verified image
        if: github.ref == 'refs/heads/main'
        run: docker save northrelay-base:${{ matrix.image }} | gzip -1 > image.tar.gz
      - name: Retain exact verified image for publication
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.image }}
          path: image.tar.gz
          compression-level: 0
          retention-days: 1
  publish:
    name: Publish verified images
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [builder-latest, runner-latest, builder-alpine-latest, runner-alpine-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.image }}
      - name: Load the scanned image
        run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit tag and release aliases
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          prefix="${IMAGE%-latest}"
          for suffix in "sha-${GITHUB_SHA}" "$(date -u +%Y%m%d)" "v$(cat VERSION)" latest; do
            target="${IMAGE_NAME}:${prefix}-${suffix}"
            docker tag "northrelay-base:${IMAGE}" "$target"
            docker push "$target"
          done
